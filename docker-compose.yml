# Production stack for a single-VPS deploy. Postgres (Supabase) and file
# storage (Cloudflare R2) are external — only compute runs here.
#
# Usage: docker compose up -d --build
# Logs:  docker compose logs -f [service]
# See docs/deploy-vps.md for the full setup walkthrough.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend-web:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Same image as backend-web, different process. Migrations run once, in
  # backend-web's start-web.sh — not repeated here.
  backend-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["bin/start-worker.sh"]
    env_file:
      - ./backend/.env.production
    depends_on:
      redis:
        condition: service_healthy

  backend-beat:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["bin/start-beat.sh"]
    env_file:
      - ./backend/.env.production
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.production
    depends_on:
      - backend-web

  # Only public-facing service. Terminates TLS (auto Let's Encrypt) and
  # reverse-proxies to the frontend; the backend is never exposed directly —
  # Next.js server routes talk to it over the internal compose network.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  redis-data:
  caddy-data:
  caddy-config:
