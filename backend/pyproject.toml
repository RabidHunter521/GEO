[tool.poetry]
name = "seenby-backend"
version = "0.1.0"
description = "SeenBy backend API and workers"
authors = ["Faris <farisirfanyaakob@gmail.com>"]
packages = [{include = "app"}, {include = "workers"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.142"
# Explicit floor: starlette < 1.3.1 carries request-parsing and Host/path
# reconstruction advisories (PYSEC-2026-161/248/249, 1941/1942, 2280/2281).
starlette = ">=1.3.1"
uvicorn = {extras = ["standard"], version = "^0.32"}
sqlalchemy = "^2.0"
alembic = "^1.14"
celery = {extras = ["redis"], version = "^5.4"}
redis = "^5.2"
google-genai = "^1.0"
openai = "^2.0"
pydantic-settings = "^2.6"
psycopg2-binary = "^2.9"
structlog = "^24.4"
python-dotenv = "^1.0"
anthropic = "^0.50"
resend = "^2.0"
httpx = "^0.28"
# 70+ fixes the url_fetcher SSRF advisories (PYSEC-2026-2034, PYSEC-2026-3940).
# It requires pydyf >= 0.11, so the old `pydyf <0.11` pin (needed only by
# WeasyPrint 62, whose stream.py called a method pydyf 0.11 removed) is gone.
weasyprint = "^70"
boto3 = "^1.35"
beautifulsoup4 = "^4.12"
lxml = "^6.0"
python-multipart = ">=0.0.31,<0.1"
google-analytics-data = "^0.18"
argon2-cffi = "^25"
pyotp = "^2.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-mock = "^3.14"
ruff = "^0.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["F", "PERF"]
# PERF203 (try/except in a loop) fights the per-unit failure isolation this
# codebase deliberately uses for concurrent/batch work (CLAUDE.md §10) — a scan
# platform, digest send, or client build failing must not sink the rest.
ignore = ["PERF203"]
